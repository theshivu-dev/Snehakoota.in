<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnehaKoota — Coming Soon</title>
<meta name="description" content="SnehaKoota — friends beyond friends. A community, on its way.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:    #FFF6E8;
    --sky-bottom: #FDE7C8;
    --marigold:   #E29B3F;
    --rust:       #B5502E;
    --banyan:     #2F5233;
    --ink:        #2B2118;
    --ink-soft:   #6B5C4C;
    --rose:       #E07A66;
    --line-idle:  rgba(43,33,24,0.16);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    text-align:center;
  }

  /* ---- Signature: converging paths ---- */
  .paths{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .paths path{
    fill:none;
    stroke-linecap:round;
  }
  .thread{
    stroke:var(--line-idle);
    stroke-width:1.4;
    stroke-dasharray:1400;
    stroke-dashoffset:1400;
    animation:draw 2.6s ease-out forwards;
  }
  .mainline{
    stroke:var(--marigold);
    stroke-width:2.6;
    stroke-dasharray:2000;
    stroke-dashoffset:2000;
    animation:draw 2.4s 1.1s ease-out forwards;
    filter:drop-shadow(0 0 6px rgba(226,155,63,0.35));
  }
  .thread:nth-child(1){ animation-delay:.05s; }
  .thread:nth-child(2){ animation-delay:.25s; }
  .thread:nth-child(3){ animation-delay:.15s; }
  .thread:nth-child(4){ animation-delay:.35s; }
  .thread:nth-child(5){ animation-delay:.2s; }
  .thread:nth-child(6){ animation-delay:.4s; }

  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }

  .sun{
    position:absolute;
    left:82%;
    top:9%;
    transform:translate(-50%,-50%);
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,155,63,0.55) 0%, rgba(226,155,63,0) 70%);
    z-index:0;
    animation:glow 4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:.55; }
    50%{ opacity:.9; }
  }

  /* ---- Content ---- */
  .content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:640px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    font-family:'Work Sans', sans-serif;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--rust);
    background:rgba(181,80,46,0.08);
    border:1px solid rgba(181,80,46,0.25);
    padding:.5em 1.1em;
    border-radius:999px;
    margin-bottom:2.1rem;
  }
  .eyebrow .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--marigold);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(.7); }
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2.6rem, 7vw, 4.6rem);
    line-height:1;
    margin:0;
    color:var(--ink);
  }
  .wordmark .sneha{ color:var(--rust); }
  .wordmark .koota{ color:var(--banyan); }

  .tagline{
    font-family:'Fraunces', serif;
    font-weight:300;
    font-style:italic;
    font-size:clamp(1.15rem, 2.6vw, 1.55rem);
    color:var(--ink-soft);
    margin:1.3rem 0 0;
    line-height:1.5;
  }

  .desc{
    font-size:1.02rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin:1.8rem 0 0;
    max-width:480px;
  }

  .kannada{
    font-size:.95rem;
    color:var(--ink-soft);
    opacity:.8;
    margin-top:.6rem;
  }

  footer{
    position:relative;
    z-index:1;
    padding-bottom:5vh;
    font-size:.82rem;
    color:var(--ink-soft);
    opacity:.75;
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .thread, .mainline, .sun, .eyebrow .dot{
      animation:none !important;
      stroke-dashoffset:0 !important;
      opacity:1 !important;
    }
  }

  @media (max-width:480px){
    .stage{ padding:10vh 7vw; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sun" aria-hidden="true"></div>

  <svg class="paths" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g transform="translate(340,0)">
      <path class="thread" d="M 40 800 C 180 700, 340 640, 470 590 S 580 545, 610 520" />
      <path class="thread" d="M 260 800 C 350 700, 460 630, 540 585 S 595 545, 610 520" />
      <path class="thread" d="M 960 800 C 860 700, 760 630, 680 585 S 625 545, 610 520" />
      <path class="thread" d="M 1170 800 C 1010 700, 850 640, 720 590 S 635 545, 610 520" />
      <path class="mainline" d="M 610 520 C 620 400, 650 260, 720 90" />
    </g>
  </svg>

  <div class="content">
    <span class="eyebrow"><span class="dot"></span>Coming Soon</span>

    <h1 class="wordmark"><span class="sneha">Sneha</span><span class="koota">Koota</span></h1>
    <p class="tagline">Friends beyond friends — a way ahead, together.</p>

    <p class="desc">
      A home for everyone who calls Haveri their own. Old friends, new ones, and everyone still to arrive — this is where our roads start meeting again.
    </p>
    <p class="kannada">ನಮ್ಮ ಬಳಗ, ಒಂದಾಗುತಿದೆ.</p>
  </div>
</div>

<footer>
  &copy; <span id="year"></span> SnehaKoota &middot; snehakoota.in
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
