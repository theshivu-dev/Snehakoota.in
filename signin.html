*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));color:var(--ink)}body{font-family:'Noto Sans Kannada','Work Sans',sans-serif;padding-left:22px;overflow-x:hidden}.edge-strip{position:fixed;left:0;top:0;bottom:0;width:22px;background:var(--edge);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;z-index:10}.edge-strip span{width:8px;height:8px;border-radius:50%;background:rgba(181,80,46,.4)}.topbar{position:relative;z-index:2;padding:1rem 5vw;display:flex;justify-content:center}.brand{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;text-decoration:none}.brand .sneha{color:var(--rust)}.brand .koota{color:var(--banyan)}.stage{position:relative;min-height:calc(100vh - 60px);min-height:calc(100svh - 60px);display:flex;align-items:center;justify-content:center;padding:6vh 6vw;overflow:hidden}.sun{position:absolute;right:4%;top:4%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(226,155,63,.48),rgba(226,155,63,0) 70%);pointer-events:none}.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}.paths path{fill:none;stroke-linecap:round}.thread{stroke:rgba(43,33,24,.12);stroke-width:1.3}.mainline{stroke:var(--marigold);stroke-width:2.2}.card{position:relative;z-index:1;width:min(100%,440px);padding:3rem 2.2rem 2.4rem;text-align:center;background:rgba(255,246,232,.72);border:1px solid rgba(43,33,24,.10);border-radius:22px;box-shadow:0 18px 50px rgba(73,48,25,.10);backdrop-filter:blur(12px)}.mark{width:58px;height:58px;margin:0 auto 1.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(181,80,46,.09);border:1px solid rgba(181,80,46,.20);color:var(--rust)}.mark svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}h1{font-family:'Fraunces',serif;font-size:clamp(2rem,7vw,2.8rem);font-weight:500;line-height:1.15;margin:0}h1 .sneha{color:var(--rust)}h1 .koota{color:var(--banyan)}.intro{margin:1rem auto 0;max-width:330px;color:var(--ink-soft);font-size:.98rem;line-height:1.75}.intro-kn{margin:.35rem auto 0;color:var(--ink-soft);font-size:.93rem;line-height:1.7}.google-btn{width:100%;margin-top:2rem;border:1px solid rgba(43,33,24,.16);border-radius:999px;background:#fff;color:var(--ink);padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:center;gap:.7rem;font:600 .94rem 'Work Sans',sans-serif;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.google-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,33,24,.10);background:#fffdf9}.google-btn:active{transform:translateY(0)}.google-btn:disabled{cursor:wait;opacity:.65;transform:none;box-shadow:none}.google-icon{width:20px;height:20px;display:block}.note{margin:1.1rem 0 0;font-size:.76rem;line-height:1.55;color:var(--ink-soft);opacity:.78}.message{min-height:1.3em;margin-top:1rem;font-size:.8rem;color:var(--rust)}.back{display:inline-block;margin-top:1.6rem;color:var(--ink-soft);font:.85rem 'Work Sans',sans-serif;text-decoration:none}.back:hover{color:var(--rust)}footer{text-align:center;padding:1rem 5vw 5vh;color:var(--ink-soft);font-size:.78rem;opacity:.72}@media(max-width:480px){.stage{padding:5vh 5vw}.card{padding:2.5rem 1.35rem 2rem;border-radius:18px}}

<section class="card" aria-labelledby="page-title"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 19c.7-3.1 3-4.8 6.5-4.8s5.8 1.7 6.5 4.8"></path></svg></div><h1 id="page-title"><span class="sneha">Sneha</span><span class="koota">Koota</span></h1><p class="intro">Continue with your Google account to be part of what comes next.</p><p class="intro-kn">ಮುಂದುವರಿಯಲು ನಿಮ್ಮ Google ಖಾತೆಯ ಮೂಲಕ ಸೈನ್ ಇನ್ ಮಾಡಿ.</p><button class="google-btn" id="googleSignIn" type="button"><svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.23z"/><path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.37l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.5z"/><path fill="#FBBC05" d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.08.31-1.59v-2.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.09l3.24-2.5z"/><path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.5 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.41l3.24 2.5C7.31 8.1 9.46 6.38 12 6.38z"/></svg>Continue with Google</button><div class="message" id="message" role="status" aria-live="polite"></div><p class="note">ಹೊಸ ಖಾತೆಯಾದರೂ, ಈಗಾಗಲೇ ಸದಸ್ಯರಾಗಿದ್ದರೂ — ಇದೇ ಮೂಲಕ ಮುಂದುವರಿಯಬಹುದು.</p><a class="back" href="javascript:history.back()">← ಹಿಂದಕ್ಕೆ</a></section></main><footer>© 2026 SnehaKoota · snehakoota.in</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hukfpoxvtutvhjfdzcuh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_6_9Fc319vRsSZSksFlhzSw_28-glehH';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
const button=document.getElementById('googleSignIn');const message=document.getElementById('message');
const params=new URLSearchParams(window.location.search);const returnTo=params.get('return');
function safeDestination(v){if(!v||!/^[a-zA-Z0-9_-]+\.html$/.test(v))return'index.html';return v;}
const destination=safeDestination(returnTo);
let redirecting=false;
function finishLogin(session){if(redirecting||!session)return;redirecting=true;message.textContent='ಸೈನ್ ಇನ್ ಯಶಸ್ವಿಯಾಗಿದೆ. ಮುಂದುವರಿಯುತ್ತಿದೆ…';button.disabled=true;window.setTimeout(()=>window.location.replace(destination),250);}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(session && (event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED')) finishLogin(session);
});

(async()=>{
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){console.error('Session error:',error);message.textContent='ಸೈನ್ ಇನ್ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.';return;}
  if(data.session && (window.location.search.includes('code=')||window.location.hash.includes('access_token')||window.location.hash.includes('refresh_token'))) finishLogin(data.session);
})();

button.addEventListener('click',async()=>{
  button.disabled=true;message.textContent='Google ಮೂಲಕ ಸುರಕ್ಷಿತವಾಗಿ ಸೈನ್ ಇನ್ ಮಾಡಲಾಗುತ್ತಿದೆ…';
  const redirectTo=`${window.location.origin}/signin.html?return=${encodeURIComponent(returnTo||'index')}`;
  const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{prompt:'select_account'}}});
  if(error){console.error('Google sign-in error:',error);message.textContent='ಸೈನ್ ಇನ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';button.disabled=false;}
});
</script>
