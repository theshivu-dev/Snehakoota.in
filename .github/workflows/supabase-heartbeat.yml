name: Supabase heartbeat

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep Snehakoota Supabase active
        env:
          PROJECT_REF: ${{ secrets.SNEHAKOOTA_SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SNEHAKOOTA_SUPABASE_ANON_KEY }}
          EXPECTED_PROJECT_REF: hukfpoxvtutvhjfdzcuh
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "$EXPECTED_PROJECT_REF" || { echo "::error::Snehakoota project ref mismatch"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 --connect-timeout 15 --max-time 45 \
            -X POST "https://${PROJECT_REF}.supabase.co/rest/v1/rpc/supabase_heartbeat" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" -H "Content-Type: application/json" \
            --data '{"p_github_run_id":'"${GITHUB_RUN_ID}"',"p_github_run_attempt":'"${GITHUB_RUN_ATTEMPT}"'}'

      - name: Keep OneHaveri Supabase active
        if: always()
        env:
          PROJECT_REF: ${{ secrets.ONEHAVERI_SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.ONEHAVERI_SUPABASE_ANON_KEY }}
          EXPECTED_PROJECT_REF: zdgbtjelxhriggjavecp
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "$EXPECTED_PROJECT_REF" || { echo "::error::OneHaveri project ref mismatch"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 --connect-timeout 15 --max-time 45 \
            -X POST "https://${PROJECT_REF}.supabase.co/rest/v1/rpc/supabase_heartbeat" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" -H "Content-Type: application/json" \
            --data '{"p_github_run_id":'"${GITHUB_RUN_ID}"',"p_github_run_attempt":'"${GITHUB_RUN_ATTEMPT}"'}'
