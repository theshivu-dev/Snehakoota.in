name: one-time-notice-ui-fix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply notice board ui refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused Notice Board refinement
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('<span class="sk-notice-kicker">ನಮ್ಮ ಸಮುದಾಯ</span>\n        <h2 class="sk-notice-title" id="skNoticeTitle">', '<h2 class="sk-notice-title" id="skNoticeTitle">'),
              ('<span class="sk-notice-kicker">ನಮ್ಮ ಸಮುದಾಯ</span>\n        <h2 id="skNoticeBoardTitle">', '<h2 id="skNoticeBoardTitle">'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected index fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          css = Path('notices/notices.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* =========================================================\n   NOTICE BOARD UI REFINEMENT — compact, aligned, self-evident\n   ========================================================= */'
          if marker not in text:
              text += '''\n\n/* =========================================================\n   NOTICE BOARD UI REFINEMENT — compact, aligned, self-evident\n   ========================================================= */\n\n.sk-notice-board-head .sk-notice-kicker,\n.sk-notice-full-head .sk-notice-kicker {\n  display:none;\n}\n\n.sk-notice-board-head {\n  align-items:center;\n  padding:clamp(.85rem,2.4vw,1.25rem) clamp(1rem,3.5vw,1.7rem) .7rem;\n}\n\n.sk-notice-preview {\n  gap:.45rem;\n  padding:0 clamp(1rem,3.5vw,1.7rem) clamp(.85rem,2.4vw,1.2rem);\n}\n\n.sk-notice-preview-trigger {\n  grid-template-columns:auto minmax(0,1fr) auto auto;\n  gap:.65rem;\n  min-height:52px;\n  padding:.56rem .7rem;\n}\n\n.sk-notice-preview-trigger .sk-notice-type { grid-column:1; }\n.sk-notice-preview-trigger strong { grid-column:2; min-width:0; }\n.sk-notice-preview-date { grid-column:3; white-space:nowrap; }\n\n.sk-notice-preview-more {\n  grid-column:4;\n  display:inline-grid;\n  place-items:center;\n  width:28px;\n  height:28px;\n  border:1px solid rgba(181,80,46,.16);\n  border-radius:50%;\n  background:rgba(181,80,46,.07);\n  color:var(--rust);\n  font-size:0;\n  line-height:1;\n}\n\n.sk-notice-preview-more::before {\n  content:'↗';\n  font-size:.9rem;\n}\n\n.sk-notice-full-trigger {\n  grid-template-columns:auto minmax(0,1fr) auto;\n  gap:.65rem;\n  padding:.72rem .8rem;\n}\n\n.sk-notice-chevron {\n  display:inline-grid;\n  place-items:center;\n  width:30px;\n  height:30px;\n  flex:0 0 30px;\n  border:1px solid rgba(181,80,46,.18);\n  border-radius:50%;\n  background:rgba(181,80,46,.07);\n  color:var(--rust);\n  font-size:0;\n  line-height:1;\n  transform:none !important;\n}\n\n.sk-notice-chevron::before {\n  content:'+';\n  font:500 1rem/1 'Work Sans', sans-serif;\n}\n\n.sk-notice-full-item.is-expanded .sk-notice-chevron::before { content:'−'; }\n\n.sk-notice-full-detail { padding:0 .8rem .9rem; }\n\n.sk-notice-board-foot { padding:0 clamp(1rem,3.5vw,1.7rem) .85rem; }\n\n@media (max-width:700px) {\n  .sk-notice-board-head { padding:.85rem 1rem .65rem; }\n  .sk-notice-preview { padding:0 1rem .85rem; }\n  .sk-notice-preview-trigger { grid-template-columns:auto minmax(0,1fr) auto; min-height:50px; }\n  .sk-notice-preview-trigger .sk-notice-type { grid-column:1; grid-row:1; }\n  .sk-notice-preview-trigger strong { grid-column:2; grid-row:1; }\n  .sk-notice-preview-more { grid-column:3; }\n}\n'''
              css.write_text(text, encoding='utf-8')

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html notices/notices.css
          git commit -m 'chore: apply notice board ui refinement'
          git push

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-notice-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-notice-ui-fix.yml
          git commit -m 'chore: remove one-time notice ui workflow'
          git push