name: apply-home-floating-intro
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'refine: make home intro a floating surface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply scoped homepage layout refinement
        shell: python
        run: |
          from pathlib import Path

          path = Path('home/home.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* =========================================================\n     HOME STAGE 5 — FLOATING INTRO SURFACE\n     ---------------------------------------------------------\n     Keeps the hero cinematic while grouping the supporting copy into\n     one maintainable floating surface that overlaps the hero threshold.\n     ========================================================= */'
          if marker in text:
              raise SystemExit('Floating intro refinement already exists')

          block = r'''\n\n/* =========================================================\n     HOME STAGE 5 — FLOATING INTRO SURFACE\n     ---------------------------------------------------------\n     Keeps the hero cinematic while grouping the supporting copy into\n     one maintainable floating surface that overlaps the hero threshold.\n     ========================================================= */\n\n.stage{\n  /* Let the hero + intro surface define the stage height naturally. */\n  min-height:auto;\n  padding-bottom:clamp(2.5rem,5vh,4rem);\n}\n\n.content{\n  width:min(100%,920px);\n  max-width:920px;\n}\n\n.home-copy{\n  position:relative;\n  z-index:2;\n  box-sizing:border-box;\n  width:min(760px, calc(100vw - 12vw));\n  margin-top:clamp(-3.5rem, -5vw, -2rem);\n  padding:clamp(1.6rem,3vw,2.5rem) clamp(1.5rem,4vw,3rem) clamp(1.5rem,3vw,2.25rem);\n  border:1px solid rgba(43,33,24,.12);\n  border-radius:28px;\n  background:rgba(255,246,232,.86);\n  box-shadow:\n    0 20px 46px rgba(43,33,24,.09),\n    0 4px 12px rgba(226,155,63,.06);\n  backdrop-filter:blur(12px);\n  -webkit-backdrop-filter:blur(12px);\n}\n\n.home-copy::before{\n  content:"";\n  display:block;\n  width:46px;\n  height:2px;\n  margin:0 auto clamp(.9rem,2vw,1.25rem);\n  border-radius:999px;\n  background:linear-gradient(90deg, rgba(181,80,46,.25), rgba(226,155,63,.72), rgba(47,82,51,.25));\n}\n\n.tagline{\n  max-width:680px;\n}\n\n.home-message{\n  width:min(100%,620px);\n  margin-top:clamp(1.1rem,2.2vw,1.5rem);\n  padding-top:clamp(1rem,2vw,1.25rem);\n}\n\n.desc{\n  font-size:clamp(.95rem,1.6vw,1.02rem);\n  line-height:1.65;\n}\n\n.kannada{\n  margin-top:.8rem;\n}\n\n@media (max-width:700px){\n  .stage{\n    padding:0 5vw clamp(2rem,5vh,3rem);\n  }\n\n  .content{\n    width:100%;\n  }\n\n  /* The road is intentionally a desktop/tablet composition;\n     the intro surface becomes the clean mobile transition. */\n  .paths{\n    display:none;\n  }\n\n  .home-copy{\n    width:100%;\n    margin-top:-1.5rem;\n    padding:1.35rem 1.1rem 1.25rem;\n    border-radius:22px;\n    box-shadow:0 14px 32px rgba(43,33,24,.08);\n  }\n\n  .home-copy::before{\n    margin-bottom:.8rem;\n  }\n\n  .tagline{\n    font-size:clamp(1.05rem,5vw,1.3rem);\n    line-height:1.42;\n  }\n\n  .home-message{\n    width:100%;\n    margin-top:1rem;\n    padding-top:.95rem;\n  }\n\n  .desc{\n    font-size:.94rem;\n    line-height:1.6;\n  }\n\n  .kannada{\n    font-size:.9rem;\n    margin-top:.7rem;\n  }\n}\n\n@media (max-width:480px){\n  .home-copy{\n    margin-top:-1.25rem;\n    padding:1.2rem .95rem 1.1rem;\n    border-radius:20px;\n  }\n\n  .tagline{\n    font-size:1.05rem;\n  }\n}\n'''
          text += block
          path.write_text(text, encoding='utf-8')

      - name: Commit homepage refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home/home.css
          git commit -m 'refine: make home intro a floating surface'
          git push

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/apply-home-floating-intro.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-home-floating-intro.yml
          git commit -m 'chore: remove one-time home layout workflow'
          git push
