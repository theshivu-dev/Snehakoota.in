name: finalize-notice-delete
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore notice files and apply focused changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          base = '24da825629f3ed55fbcb05189814d10199578e76'

          def base_file(path):
              return subprocess.check_output(['git','show',f'{base}:{path}'], text=True)

          # Restore the original V1 notice files first, then apply only the
          # deletion-specific changes. This prevents accidental formatting drift.
          service = base_file('notices/notices-service.js')
          service_old = '''  window.SnehakootaNoticesService = Object.freeze({\n    getVisibleUpdates\n  });'''
          service_new = '''  async function getManageCapabilities(updateIds) {\n    const ids = Array.isArray(updateIds)\n      ? updateIds.map(Number).filter(Number.isFinite)\n      : [];\n\n    if (!ids.length) return new Map();\n\n    const { data, error } = await client.rpc(\n      "community_updates_get_manage_capabilities",\n      { p_update_ids: ids }\n    );\n\n    if (error) throw error;\n\n    return new Map((data || []).map(function(row) {\n      return [Number(row.update_id), row.can_manage === true];\n    }));\n  }\n\n  async function deleteUpdate(updateId) {\n    const id = Number(updateId);\n    if (!Number.isFinite(id)) {\n      throw new Error("Invalid Community Update id");\n    }\n\n    const result = await client.rpc("community_updates_delete", {\n      p_update_id: id\n    });\n\n    if (result.error) throw result.error;\n    return true;\n  }\n\n  window.SnehakootaNoticesService = Object.freeze({\n    getVisibleUpdates,\n    getManageCapabilities,\n    deleteUpdate\n  });'''
          if service_old not in service:
              raise SystemExit('service marker not found')
          Path('notices/notices-service.js').write_text(service.replace(service_old, service_new, 1), encoding='utf-8')

          js = base_file('notices/notices.js')
          old = '''        '<div class="sk-notice-full-detail" hidden>',\n          update.content ? '<p>' + escapeHtml(update.content).replace(/\\n/g, "<br>") + '</p>' : '',\n          eventInfo,'''
          new = '''        '<div class="sk-notice-full-detail" hidden>',\n          '<div class="sk-notice-full-actions" data-notice-actions hidden>',\n            '<button class="sk-notice-delete" type="button" data-notice-delete="', update.id, '" aria-label="Delete ', escapeHtml(update.title), '">',\n              '<span aria-hidden="true">⌫</span><span>Delete notice</span>',\n            '</button>',\n            '<span class="sk-notice-delete-status" data-notice-delete-status aria-live="polite"></span>',\n          '</div>',\n          update.content ? '<p>' + escapeHtml(update.content).replace(/\\n/g, "<br>") + '</p>' : '',\n          eventInfo,'''
          if old not in js:
              raise SystemExit('detail marker not found')
          js = js.replace(old, new, 1)

          old = '''    elements.fullList.innerHTML = state.updates\n      .map(renderFullItem)\n      .join("");'''
          new = '''    elements.fullList.innerHTML = state.updates\n      .map(renderFullItem)\n      .join("");\n\n    loadManageCapabilities();'''
          if old not in js:
              raise SystemExit('render marker not found')
          js = js.replace(old, new, 1)

          marker = '''  function bindItemActions() {'''
          insert = '''  async function loadManageCapabilities() {\n    const elements = getElements();\n    if (!elements.fullList || !window.SnehakootaNoticesService) return;\n\n    try {\n      const ids = state.updates.map(function(update) { return update.id; });\n      const capabilities = await window.SnehakootaNoticesService.getManageCapabilities(ids);\n      elements.fullList.querySelectorAll('[data-notice-actions]').forEach(function(actions) {\n        const item = actions.closest('[data-notice-id]');\n        if (!item) return;\n        const id = Number(item.getAttribute('data-notice-id'));\n        actions.hidden = capabilities.get(id) !== true;\n      });\n    } catch (error) {\n      console.error("Community Update management capabilities load failed:", error);\n    }\n  }\n\n  async function handleDelete(button) {\n    const item = button.closest('.sk-notice-full-item');\n    const status = item && item.querySelector('[data-notice-delete-status]');\n    const updateId = button.getAttribute('data-notice-delete');\n    const update = state.updates.find(function(row) { return String(row.id) === String(updateId); });\n    if (!item || !update || button.disabled) return;\n\n    if (!window.confirm('Delete this notice? This cannot be undone.\\n\\n' + update.title)) return;\n\n    button.disabled = true;\n    button.setAttribute('aria-busy', 'true');\n    if (status) status.textContent = 'Deleting…';\n\n    try {\n      await window.SnehakootaNoticesService.deleteUpdate(updateId);\n      state.updates = state.updates.filter(function(row) { return String(row.id) !== String(updateId); });\n      render();\n    } catch (error) {\n      console.error("Community Update delete failed:", error);\n      button.disabled = false;\n      button.removeAttribute('aria-busy');\n      if (status) status.textContent = 'Could not delete. Please try again.';\n    }\n  }\n\n  function bindItemActions() {'''
          if marker not in js:
              raise SystemExit('bind marker not found')
          js = js.replace(marker, insert, 1)

          old = '''    elements.fullList.querySelectorAll("[data-notice-toggle]").forEach(function(button) {'''
          new = '''    elements.fullList.querySelectorAll("[data-notice-delete]").forEach(function(button) {\n      button.addEventListener("click", function(event) {\n        event.stopPropagation();\n        handleDelete(button);\n      });\n    });\n\n    elements.fullList.querySelectorAll("[data-notice-toggle]").forEach(function(button) {'''
          if old not in js:
              raise SystemExit('toggle marker not found')
          js = js.replace(old, new, 1)
          Path('notices/notices.js').write_text(js, encoding='utf-8')

          css = base_file('notices/notices.css')
          css += '''\n\n/* =========================================================\n   NOTICE BOARD DELETE CONTROLS — visible only on expanded items\n   ========================================================= */\n.sk-notice-full-actions {\n  display:flex;\n  align-items:center;\n  gap:.75rem;\n  margin-top:.8rem;\n  margin-bottom:.8rem;\n  padding:.7rem .75rem;\n  border:1px solid rgba(181,80,46,.12);\n  border-radius:12px;\n  background:rgba(181,80,46,.035);\n}\n\n.sk-notice-delete {\n  display:inline-flex;\n  align-items:center;\n  justify-content:center;\n  gap:.45rem;\n  min-height:34px;\n  padding:.4rem .72rem;\n  border:1px solid rgba(181,80,46,.2);\n  border-radius:999px;\n  background:rgba(181,80,46,.07);\n  color:var(--rust);\n  font:600 .78rem/1 'Work Sans',sans-serif;\n  cursor:pointer;\n  transition:background .16s ease,border-color .16s ease,opacity .16s ease;\n}\n\n.sk-notice-delete:hover,\n.sk-notice-delete:focus-visible {\n  background:rgba(181,80,46,.13);\n  border-color:rgba(181,80,46,.34);\n  outline:none;\n}\n\n.sk-notice-delete:disabled {\n  opacity:.55;\n  cursor:wait;\n}\n\n.sk-notice-delete-status {\n  color:var(--ink-soft);\n  font-size:.78rem;\n}\n\n@media (max-width:700px) {\n  .sk-notice-full-actions {\n    align-items:flex-start;\n    flex-direction:column;\n    gap:.45rem;\n  }\n}\n'''
          Path('notices/notices.css').write_text(css, encoding='utf-8')

          # Remove this one-time workflow before committing the finished state.
          Path('.github/workflows/finalize-notice-delete.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notices/notices-service.js notices/notices.js notices/notices.css .github/workflows/finalize-notice-delete.yml
          git commit -m 'feat: add notice board delete controls'
          git push
