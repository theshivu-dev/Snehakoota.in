name: apply-notice-delete-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message != 'feat: add notice board delete controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add notice delete controls
        run: python3 - <<'PY'
          from pathlib import Path

          service = Path('notices/notices-service.js')
          text = service.read_text(encoding='utf-8')
          old = '''  window.SnehakootaNoticesService = Object.freeze({
    getVisibleUpdates
  });'''
          new = '''  async function getManageCapabilities(updateIds) {
    const ids = Array.isArray(updateIds) ? updateIds.map(Number).filter(Number.isFinite) : [];
    if (!ids.length) return new Map();
    const { data, error } = await client.rpc("community_updates_get_manage_capabilities", {
      p_update_ids: ids
    });
    if (error) throw error;
    return new Map((data || []).map(function(row) {
      return [Number(row.update_id), row.can_manage === true];
    }));
  }

  async function deleteUpdate(updateId) {
    const id = Number(updateId);
    if (!Number.isFinite(id)) throw new Error("Invalid Community Update id");
    const result = await client.rpc("community_updates_delete", { p_update_id: id });
    if (result.error) throw result.error;
    return true;
  }

  window.SnehakootaNoticesService = Object.freeze({
    getVisibleUpdates,
    getManageCapabilities,
    deleteUpdate
  });'''
          if old not in text:
              raise SystemExit('Expected notices-service export block not found')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          js = Path('notices/notices.js')
          text = js.read_text(encoding='utf-8')
          old = '''        '<div class="sk-notice-full-detail" hidden>',
          update.content ? '<p>' + escapeHtml(update.content).replace(/\\n/g, "<br>") + '</p>' : '',
          eventInfo,'''
          new = '''        '<div class="sk-notice-full-detail" hidden>',
          '<div class="sk-notice-full-actions" data-notice-actions hidden>',
            '<button class="sk-notice-delete" type="button" data-notice-delete="', update.id, '" aria-label="Delete ', escapeHtml(update.title), '">',
              '<span aria-hidden="true">⌫</span><span>Delete notice</span>',
            '</button>',
            '<span class="sk-notice-delete-status" data-notice-delete-status aria-live="polite"></span>',
          '</div>',
          update.content ? '<p>' + escapeHtml(update.content).replace(/\\n/g, "<br>") + '</p>' : '',
          eventInfo,'''
          if old not in text:
              raise SystemExit('Expected notice detail marker not found')
          text = text.replace(old, new, 1)

          old = '''    elements.fullList.innerHTML = state.updates
      .map(renderFullItem)
      .join("");'''
          new = '''    elements.fullList.innerHTML = state.updates
      .map(renderFullItem)
      .join("");

    loadManageCapabilities();'''
          if old not in text:
              raise SystemExit('Expected full list render marker not found')
          text = text.replace(old, new, 1)

          marker = '''  function bindItemActions() {'''
          insert = '''  async function loadManageCapabilities() {
    const elements = getElements();
    if (!elements.fullList || !window.SnehakootaNoticesService) return;
    try {
      const ids = state.updates.map(function(update) { return update.id; });
      const capabilities = await window.SnehakootaNoticesService.getManageCapabilities(ids);
      elements.fullList.querySelectorAll('[data-notice-actions]').forEach(function(actions) {
        const item = actions.closest('[data-notice-id]');
        if (!item) return;
        const id = Number(item.getAttribute('data-notice-id'));
        actions.hidden = capabilities.get(id) !== true;
      });
    } catch (error) {
      console.error("Community Update management capabilities load failed:", error);
    }
  }

  async function handleDelete(button) {
    const item = button.closest('.sk-notice-full-item');
    const status = item && item.querySelector('[data-notice-delete-status]');
    const updateId = button.getAttribute('data-notice-delete');
    const update = state.updates.find(function(row) { return String(row.id) === String(updateId); });
    if (!item || !update || button.disabled) return;
    if (!window.confirm('Delete this notice? This cannot be undone.\\n\\n' + update.title)) return;
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    if (status) status.textContent = 'Deleting…';
    try {
      await window.SnehakootaNoticesService.deleteUpdate(updateId);
      state.updates = state.updates.filter(function(row) { return String(row.id) !== String(updateId); });
      render();
    } catch (error) {
      console.error("Community Update delete failed:", error);
      button.disabled = false;
      button.removeAttribute('aria-busy');
      if (status) status.textContent = 'Could not delete. Please try again.';
    }
  }

  function bindItemActions() {'''
          if marker not in text:
              raise SystemExit('Expected bindItemActions marker not found')
          text = text.replace(marker, insert, 1)

          old = '''    elements.fullList.querySelectorAll("[data-notice-toggle]").forEach(function(button) {'''
          new = '''    elements.fullList.querySelectorAll("[data-notice-delete]").forEach(function(button) {
      button.addEventListener("click", function(event) {
        event.stopPropagation();
        handleDelete(button);
      });
    });

    elements.fullList.querySelectorAll("[data-notice-toggle]").forEach(function(button) {'''
          if old not in text:
              raise SystemExit('Expected toggle binding marker not found')
          text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')

          css = Path('notices/notices.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* =========================================================\n   NOTICE BOARD DELETE CONTROLS\n   ========================================================= */'
          if marker not in text:
              text += '''

/* =========================================================
   NOTICE BOARD DELETE CONTROLS
   ========================================================= */
.sk-notice-full-actions{
  display:flex;
  align-items:center;
  gap:.75rem;
  margin-top:.8rem;
  padding-top:.75rem;
  border-top:1px solid rgba(43,33,24,.08);
}
.sk-notice-delete{
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  min-height:34px;
  padding:.4rem .7rem;
  border:1px solid rgba(181,80,46,.18);
  border-radius:999px;
  background:rgba(181,80,46,.055);
  color:var(--rust);
  font:500 .78rem/1 'Work Sans',sans-serif;
  cursor:pointer;
}
.sk-notice-delete:hover{ background:rgba(181,80,46,.11); border-color:rgba(181,80,46,.3); }
.sk-notice-delete:disabled{ opacity:.55; cursor:wait; }
.sk-notice-delete-status{ color:var(--ink-soft); font-size:.78rem; }
@media (max-width:700px){
  .sk-notice-full-actions{ align-items:flex-start; flex-direction:column; gap:.45rem; }
}
'''
          css.write_text(text, encoding='utf-8')
      - name: Commit notice delete controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notices/notices-service.js notices/notices.js notices/notices.css
          git commit -m 'feat: add notice board delete controls'
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/apply-notice-delete-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-notice-delete-ui.yml
          git commit -m 'chore: remove one-time notice delete workflow'
          git push
