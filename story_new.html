<style>
  .topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:.9rem 5vw;
  backdrop-filter:blur(10px);
  background:rgba(255,246,232,.75);
  border-bottom:1px solid rgba(43,33,24,.10);
}

.topbar .brand{
  font-family:var(--font-display,'Fraunces',serif);
  font-weight:600;
  font-size:1rem;
  text-decoration:none;
}

.topbar .brand .sneha{ color:var(--rust); }
.topbar .brand .koota{ color:var(--banyan); }
  
  :root{
    --cream:#f6efe1;
    --cream-deep:#efe4cd;
    --paper-edge:#e3d5b3;
    --ink:#2c2318;
    --ink-soft:#5a4d3c;

    --green:#33493a;

    overflow-x:hidden;
  }

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.015) 0, transparent 45%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.02) 0, transparent 50%);
    pointer-events:none;
    z-index:0;
  }

  .kn{ font-family:'Noto Serif Kannada','Noto Sans Kannada', serif; }
  .kn-sans{ font-family:'Noto Sans Kannada', sans-serif; }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--green-deep);
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--terracotta-deep);
    font-weight:600;
  }

  a{ color:inherit; }

  /* ---------- binding spine (signature element) ---------- */
  .spine{
    position:fixed;
    left:0; top:0; bottom:0;
    width:34px;
    z-index:40;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 0;
    pointer-events:none;
  }
  .spine::before{
    content:"";
    position:absolute; top:0; bottom:0; left:16px;
    width:1px;
    background:linear-gradient(to bottom, transparent, var(--thread) 6%, var(--thread) 94%, transparent);
  }
  .spine-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--paper-edge);
    border:1px solid var(--thread);
    margin:0 0 0 0;
    position:relative;
    transition:background .5s ease, border-color .5s ease, box-shadow .5s ease;
  }
  .spine-track{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    width:100%;
  }
  .spine-dot.lit{
    background:var(--terracotta);
    border-color:var(--terracotta-deep);
    box-shadow:0 0 0 3px rgba(192,95,55,0.12);
  }
  @media (max-width:880px){ .spine{display:none;} }

  /* ---------- layout shells ---------- */
  .wrap{

  .stitch span{

  .tagline{
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    letter-spacing:0.08em;
    text-transform:uppercase;

  .scroll-cue{

<!-- ================= CHAPTER 1: HOW IT BEGAN ================= -->
<section>
  <div class="wrap">
    <div class="chapter-label reveal">
      <span class="chapter-num kn">ಅಧ್ಯಾಯ ೧</span>
      <span class="eyebrow">Where every SnehaKoota starts</span>
    </div>
    <h2 class="title reveal">It rarely starts as a plan.<br>It starts as <em>one message.</em></h2>
    <p class="lede reveal">Someone in an old class group types the question everyone had been quietly thinking: <em>“Shall we meet again?”</em></p>
    <p class="reveal">A few replies. A phone number shared. A forgotten face resurfacing in someone's memory. Slowly, a scattered set of people who once shared a school bench, a hostel wing, or a college fest becomes a group again — first on a phone, then in a room together.</p>
    <p class="reveal">That's the whole origin story, really. Not a company, not a product — just people trying to hold on to each other a little longer than distance usually allows.</p>
    <div class="pull reveal">The reunion is never the point. It's just the first page.</div>
  </div>
</section>

<!-- ================= CHAPTER 2: WHAT SNEHAKOOTA IS ================= -->
<section class="band">
  <div class="wrap">
    <div class="chapter-label reveal">
      <span class="chapter-num kn">ಅಧ್ಯಾಯ ೨</span>
      <span class="eyebrow">The idea behind the name</span>
    </div>
    <h2 class="title reveal">SnehaKoota is a <em>koota</em> —<br>a gathering that doesn't disband.</h2>
    <p class="lede reveal">ಸ್ನೇಹ means friendship. ಕೂಟ means a gathering, a coming-together. Put simply: a friendship that keeps gathering, long after the event that first brought it into a room.</p>
    <p class="reveal">Not an event page that goes quiet after the photos are shared. Not another WhatsApp group buried under a hundred unread messages. SnehaKoota is meant to be the place a friend-circle can quietly return to — to remember, to check in, to stay a circle.</p>

    <div class="kn-pull reveal">ನೆನಪುಗಳು ನಮ್ಮನ್ನು ಮತ್ತೆ ಭೇಟಿಮಾಡಿಸುತ್ತವೆ;<br>ಮೌಲ್ಯಗಳು ನಮ್ಮನ್ನು ಜೊತೆಯಾಗಿ ಮುಂದುವರಿಸುತ್ತವೆ.</div>

    <div class="grid3 reveal">
      <div class="card">
        <span class="glyph">ನೆ</span>
        <h3>Different paths, one circle</h3>
        <p>Doctors, farmers, engineers, homemakers, artists — different professions and opinions are treated as what makes a circle richer, not a reason it should drift apart.</p>
      </div>
      <div class="card">
        <span class="glyph">ಮ</span>
        <h3>Friendship before formality</h3>
        <p>No titles, no hierarchy of "who matters more" — just the same easy warmth a group of old friends has always had with each other.</p>
      </div>
      <div class="card">
        <span class="glyph">ಜೊ</span>
        <h3>A direction, not a destination</h3>
        <p>There's no finish line to reach. Just a shared intention to keep showing up for one another, one small step at a time.</p>
      </div>
    </div>
  </div>
</section>

<!-- ================= CHAPTER 3: BEYOND ONE BATCH ================= -->
<section>
  <div class="wrap">
    <div class="chapter-label reveal">
      <span class="chapter-num kn">ಅಧ್ಯಾಯ ೩</span>
      <span class="eyebrow">Who this is, and how a circle finds its place here</span>
    </div>
    <h2 class="title reveal">SnehaKoota began with<br><em>HSHS 2004, Haveri.</em></h2>
    <p class="lede reveal">This wasn't built by a company or an institution — just individuals from that batch, quietly putting a shared idea into a shape the whole gang could return to. As it stands today, SnehaKoota is the home of the HSHS 2004 Haveri batch — nothing more claimed than that, and nothing else held responsible for it.</p>
    <p class="reveal">That said, the idea underneath was never meant to stay that small. As the space itself grows and is ready for it, other batches and friend-circles may find their way in too — each through an invitation, each becoming its own quiet corner of the house. No promises on when or how yet; just an intention, held gently.</p>
    <p class="reveal">And underneath all of it — a simple belief: friendship was never meant to be boxed in by a school, a city, or a batch year. SnehaKoota starting with one batch is just where this particular story happened to begin.</p>
    <div class="today-strip reveal">
      <span class="today-dot" aria-hidden="true"></span>
      <p>Inside SnehaKoota, each circle keeps a space that's <strong>its own</strong> — private to its people — while some things, like who belongs to which batch, sit in a lighter, shared part of the house that circles can see across.</p>
    </div>
  </div>
</section>

<!-- ================= CHAPTER 4: HOW YOU'D ENTER ================= -->
<section class="band">
  <div class="wrap">

    <h2 class="title reveal">You wouldn't sign up. <em>You'd be invited in.</em></h2>
    <p class="lede reveal">The idea is that a circle like this should feel less like creating an account, and more like being welcomed by someone you already trust.</p>
    <p class="reveal">A simple sign-in, and an invitation from a friend who's already part of the circle — that's the shape of it. Nothing that asks for more of you than a reunion itself would.</p>
    <p class="reveal">There's nothing to buy here, and nothing being sold. Just a space we all share — which also means it's ours to look after, together, the same easy way old friends look out for each other and for the room they're sitting in.</p>

    <p class="reveal">ಒಂದೆರಡು ಉತ್ತರಗಳು. ಒಂದು ಫೋನ್ ನಂಬರ್ ಹಂಚಿಕೆ. ಮರೆತುಹೋಗಿದ್ದ ಮುಖವೊಂದು ಯಾರದೋ ನೆನಪಿನಲ್ಲಿ ಮತ್ತೆ ಮೂಡುತ್ತದೆ. ನಿಧಾನವಾಗಿ, ಒಂದು ಕಾಲದಲ್ಲಿ ಒಂದೇ ಶಾಲಾ ಬೆಂಚು, ಹಾಸ್ಟೆಲ್ ವಿಭಾಗ, ಅಥವಾ ಕಾಲೇಜಿನ ಫೆಸ್ಟ್ ಹಂಚಿಕೊಂಡಿದ್ದ, ಚದುರಿಹೋಗಿದ್ದ ಜನರು ಮತ್ತೆ ಒಂದಾಗುತ್ತಾರೆ — ಮೊದಲು ಫೋನ್‌ನಲ್ಲಿ, ನಂತರ ಒಂದೇ ಕೋಣೆಯಲ್ಲಿ ಜೊತೆಯಾಗಿ.</p>
    <p class="reveal">ಇದೇ ನಿಜವಾದ ಮೂಲ ಕಥೆ. ಒಂದು ಕಂಪನಿಯಲ್ಲ, ಒಂದು ಉತ್ಪನ್ನವಲ್ಲ — ದೂರ ಸಾಮಾನ್ಯವಾಗಿ ಬಿಡುವ ಅಂತರಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಹೆಚ್ಚು ಕಾಲ ಒಬ್ಬರನ್ನೊಬ್ಬರು ಹಿಡಿದಿಟ್ಟುಕೊಳ್ಳಲು ಪ್ರಯತ್ನಿಸುತ್ತಿರುವ ಜನರಷ್ಟೇ.</p>

<section>

      <span class="eyebrow">ಇದು ಯಾರದ್ದು, ಒಂದು ಬಳಗ ಇಲ್ಲಿ ತನ್ನ ಸ್ಥಾನ ಕಂಡುಕೊಳ್ಳುವುದು ಹೇಗೆ</span>

    <h2 class="title reveal">ಸ್ನೇಹಕೂಟ ಆರಂಭವಾಗಿದ್ದು<br><em>HSHS 2004, ಹಾವೇರಿಯಿಂದ.</em></h2>
    <p class="lede reveal">ಇದನ್ನು ಯಾವುದೇ ಕಂಪನಿ ಅಥವಾ ಸಂಸ್ಥೆ ಕಟ್ಟಿಲ್ಲ — ಆ ಬ್ಯಾಚ್‌ನ ಕೆಲವು ವ್ಯಕ್ತಿಗಳು, ಇಡೀ ಬಳಗ ಮರಳಿ ಬರಬಹುದಾದ ಒಂದು ಹಂಚಿಕೆಯ ಆಲೋಚನೆಯನ್ನು ಸದ್ದಿಲ್ಲದೆ ರೂಪಿಸಿದ್ದಾರೆ ಅಷ್ಟೇ. ಇಂದಿನ ಸ್ಥಿತಿಯಲ್ಲಿ, ಸ್ನೇಹಕೂಟ HSHS 2004 ಹಾವೇರಿ ಬ್ಯಾಚ್‌ನ ಮನೆ — ಇದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಯಾವ ಹಕ್ಕೂ ಇಲ್ಲ, ಬೇರೆ ಯಾರನ್ನೂ ಇದಕ್ಕೆ ಜವಾಬ್ದಾರರನ್ನಾಗಿ ಮಾಡುವುದೂ ಇಲ್ಲ.</p>
    <p class="reveal">ಆದರೂ, ಇದರ ಹಿಂದಿನ ಆಲೋಚನೆ ಇಷ್ಟೇ ಚಿಕ್ಕದಾಗಿ ಉಳಿಯಬೇಕೆಂದು ಎಂದೂ ಇರಲಿಲ್ಲ. ಸ್ಥಳ ಬೆಳೆದಂತೆ, ಅದಕ್ಕೆ ಸಿದ್ಧವಾದಾಗ, ಬೇರೆ ಬ್ಯಾಚ್‌ಗಳು ಮತ್ತು ಗೆಳೆಯರ ಬಳಗಗಳೂ ಇಲ್ಲಿ ತಮ್ಮ ದಾರಿ ಕಂಡುಕೊಳ್ಳಬಹುದು — ಪ್ರತಿಯೊಂದೂ ಒಂದು ಆಹ್ವಾನದ ಮೂಲಕ, ಪ್ರತಿಯೊಂದೂ ಈ ಮನೆಯ ತನ್ನದೇ ಆದ ಸದ್ದಿಲ್ಲದ ಮೂಲೆಯಾಗಿ. ಯಾವಾಗ, ಹೇಗೆ ಎಂಬುದರ ಬಗ್ಗೆ ಇನ್ನೂ ಯಾವುದೇ ಭರವಸೆ ಇಲ್ಲ; ಇರುವುದು ಕೇವಲ ಒಂದು ಆಲೋಚನೆ, ಮೃದುವಾಗಿ ಇಟ್ಟುಕೊಂಡಿರುವಂಥದ್ದು.</p>
    <p class="reveal">ಮತ್ತು ಇದೆಲ್ಲದರ ತಳಹದಿಯಲ್ಲಿ — ಒಂದು ಸರಳ ನಂಬಿಕೆ: ಗೆಳೆತನವನ್ನು ಎಂದೂ ಒಂದು ಶಾಲೆ, ಒಂದು ಊರು, ಅಥವಾ ಒಂದು ಬ್ಯಾಚ್ ವರ್ಷಕ್ಕೆ ಸೀಮಿತಗೊಳಿಸಬೇಕಿರಲಿಲ್ಲ. ಸ್ನೇಹಕೂಟ ಒಂದು ಬ್ಯಾಚ್‌ನಿಂದ ಆರಂಭವಾಗಿದ್ದು, ಈ ನಿರ್ದಿಷ್ಟ ಕಥೆ ಎಲ್ಲಿ ಆರಂಭವಾಯಿತು ಎಂಬುದಷ್ಟೇ.</p>
    <div class="today-strip reveal">
      <span class="today-dot" aria-hidden="true"></span>
      <p>ಸ್ನೇಹಕೂಟದೊಳಗೆ, ಪ್ರತಿಯೊಂದು ಬಳಗವೂ <strong>ತನ್ನದೇ ಆದ</strong> ಸ್ಥಳವನ್ನು ಹೊಂದಿರುತ್ತದೆ — ತನ್ನ ಜನರಿಗೆ ಮಾತ್ರ ಖಾಸಗಿಯಾಗಿ — ಆದರೆ ಯಾರು ಯಾವ ಬ್ಯಾಚ್‌ಗೆ ಸೇರಿದ್ದಾರೆ ಎಂಬಂತಹ ಕೆಲವು ಸಂಗತಿಗಳು, ಎಲ್ಲಾ ಬಳಗಗಳೂ ನೋಡಬಹುದಾದ ಮನೆಯ ಹಗುರವಾದ, ಹಂಚಿಕೆಯ ಭಾಗದಲ್ಲಿ ಇರುತ್ತವೆ.</p>
    </div>
  </div>
</section>

<script>
  // scroll-reveal
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });
  revealEls.forEach(el => io.observe(el));

  // binding spine progress
  const track = document.getElementById('spineTrack');
  const DOT_COUNT = 22;
  for (let i = 0; i < DOT_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'spine-dot';
    track.appendChild(d);
  }
  const dots = track.querySelectorAll('.spine-dot');
  function updateSpine(){
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const progress = scrollable > 0 ? window.scrollY / scrollable : 0;
    const lit = Math.round(progress * dots.length);
    dots.forEach((d, i) => d.classList.toggle('lit', i < lit));
  }
  window.addEventListener('scroll', updateSpine, { passive: true });
  window.addEventListener('resize', updateSpine);
  updateSpine();

  // language toggle
  const langToggle = document.getElementById('langToggle');
  const enPanel = document.getElementById('lang-en');
  const knPanel = document.getElementById('lang-kn');
  let currentLang = 'en';
  function setLang(lang){
    currentLang = lang;
    if (lang === 'kn') {
      enPanel.setAttribute('hidden', '');
      knPanel.removeAttribute('hidden');
      langToggle.textContent = 'Read in English';
    } else {
      knPanel.setAttribute('hidden', '');
      enPanel.removeAttribute('hidden');
      langToggle.textContent = 'ಕನ್ನಡದಲ್ಲಿ ಓದಿ';
    }
    window.scrollTo(0, 0);
    updateSpine();
  }
  langToggle.addEventListener('click', () => setLang(currentLang === 'en' ? 'kn' : 'en'));
</script>
