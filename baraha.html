<!doctype html>
<html lang="kn">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#fff6e8" />
        <title>Baraha — Snehakoota Prototype</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="theme.css" />
        <link rel="stylesheet" href="baraha.css?v=8" />
         <link rel="stylesheet" href="footer.css">
<script src="footer.js" defer></script>
        <link rel="stylesheet" href="navigation.css?v=7">
        <script src="navigation.js?v=1" defer></script>
    </head>
    <body>
        <div class="app">
            <header class="top">
                <div class="brand"><b>ಬರಹ</b></div>
                <div class="ctx">
                    <span>ಸದಸ್ಯತ್ವ</span><select id="membershipSelect"></select>
                </div>
            </header>
            <main id="landing">
                <section class="hero">
                    <div class="eyebrow">ಸ್ನೇಹಕೂಟ</div>
                    <h1>ಬರೆಯಿರಿ. ನೆನಪಿಡಿ. ಹಂಚಿಕೊಳ್ಳಿ.</h1>
                    <p>ನಿಮ್ಮ ಮಾತು, ನೆನಪು, ಕವನ ಅಥವಾ ಕಥೆ — ನಿಮ್ಮದೇ ಜಾಗದಲ್ಲಿ.</p>
                </section>
                <div class="chips" id="chips"></div>
                <section>
                    <div class="sect">ಇತ್ತೀಚಿನ ಬರಹಗಳು</div>
                    <div class="feed" id="feed"></div>
                </section>
            </main>
            <main class="editor" id="editor">
                <div class="etop">
                    <button class="back" id="back">← ಹಿಂದೆ</button>
                    <span class="status">Draft</span>
                </div>
                <div class="modes" id="modes"></div>
                <input id="title" placeholder="ಶೀರ್ಷಿಕೆ" />
                <textarea id="body" placeholder="ಇಲ್ಲಿ ಬರೆಯಿರಿ…"></textarea>
                <div class="vis">
                    <label>ಯಾರು ನೋಡಬಹುದು?</label>
                    <div class="vrow" id="vis"></div>
                    <div class="members" id="members"></div>
                </div>
                <button class="publish" id="publish" disabled>Publish</button>
            </main>
            <button class="fab" id="fab">+ ಬರೆಯಿರಿ</button>
        </div>
        <section class="baraha-reader" id="barahaReader" aria-hidden="true" aria-label="ಬರಹ ಓದುಗ">
            <div class="baraha-reader__panel" role="dialog" aria-modal="true" aria-labelledby="barahaReaderTitle">
                <header class="baraha-reader__header">
                    <button class="baraha-reader__close" id="barahaReaderClose" type="button" aria-label="ಮುಚ್ಚಿ">← <span>ಹಿಂದೆ</span></button>
                    <div class="baraha-reader__actions" id="barahaReaderHeaderActions"></div>
                </header>
                <div class="baraha-reader__body" id="barahaReaderBody" tabindex="-1">
                    <div class="baraha-reader__meta" id="barahaReaderMeta"></div>
                    <h1 class="baraha-reader__title" id="barahaReaderTitle"></h1>
                    <div class="baraha-reader__author" id="barahaReaderAuthor"></div>
                    <div class="baraha-reader__content" id="barahaReaderContent"></div>
                    <footer class="baraha-reader__footer" id="barahaReaderFooter"></footer>
                </div>
            </div>
            <button class="baraha-reader__return" id="barahaReaderReturn" type="button" aria-label="ಹಿಂದೆ">
                <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <path d="M29 10 15 24l14 14"></path>
                </svg>
            </button>
        </section>
        <div class="baraha-backdrop" id="backdrop">
            <div class="sheet">
                <div class="grab"></div>
                <div class="sheethead">
                    <h3>ಏನು ಬರೆಯಲು ಇಷ್ಟ?</h3>
                    <button class="close" id="close">×</button>
                </div>
                <div class="options" id="options">
                    <button class="opt" data-mode="ಬರಹ">
                        <strong>ಬರಹ</strong>
                        <small>ನಿಮ್ಮ ವಿಚಾರ, ಅನುಭವ ಅಥವಾ ಕಥೆ</small>
                    </button>
                    <button class="opt" data-mode="ಕವನ">
                        <strong>ಕವನ</strong>
                        <small>ಪದಗಳಲ್ಲಿ ನಿಮ್ಮ ಭಾವನೆ</small>
                    </button>
                    <button class="opt" data-mode="ನೆನಪು">
                        <strong>ನೆನಪು</strong>
                        <small>ಮರೆಯಲಾಗದ ಒಂದು ಕ್ಷಣ</small>
                    </button>
                    <button class="opt" data-mode="ಲೇಖನ">
                        <strong>ಲೇಖನ</strong>
                        <small>ಸ್ವಲ್ಪ ದೀರ್ಘವಾಗಿ ಬರೆಯಿರಿ</small>
                    </button>
                </div>
                <div class="note">ಖಾಸಗಿ ಬರಹಗಳು ನಿಮಗೆ ಮಾತ್ರ ಕಾಣುತ್ತವೆ. ಸದಸ್ಯರಿಗೆ ಹಂಚಿದರೆ ಆಯ್ಕೆ ಮಾಡಿದ membership ಗೆ ಮಾತ್ರ ಕಾಣುತ್ತದೆ.</div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="baraha-context.js"></script>
        <script src="baraha-model.js"></script>
        <script src="baraha-service.js"></script>
        <script src="baraha-view.js"></script>
        <script src="baraha-controller.js"></script>
        <script src="baraha-reader.js"></script>
        <script>
            const SUPABASE_URL = "https://hukfpoxvtutvhjfdzcuh.supabase.co";
            const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6_9Fc319vRsSZSksFlhzSw_28-glehH";
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
            const barahaService = new BarahaService(supabaseClient);
            const barahaContext = new BarahaContext();
            const barahaModel = new BarahaModel();
            const barahaController = new BarahaController({
                context: barahaContext,
                model: barahaModel,
                service: barahaService
            });
            let readerOpenedFromUrl = false;
            const barahaReader = new BarahaReader({
                onClose: () => {
                    if (!readerOpenedFromUrl) return;
                    const url = new URL(window.location.href);
                    if (!url.searchParams.has("post")) {
                        readerOpenedFromUrl = false;
                        return;
                    }
                    url.searchParams.delete("post");
                    window.history.replaceState(window.history.state, "", url.toString());
                    readerOpenedFromUrl = false;
                }
            });

            // 2.1 — Static data contract.
            // Categories remain UI-facing vocabulary. Memberships are loaded from Supabase below.
            const BARAHA_CATEGORIES = [
                { key: "baraha", label: "ಬರಹ" },
                { key: "poem", label: "ಕವನ" },
                { key: "memory", label: "ನೆನಪು" },
                { key: "article", label: "ಲೇಖನ" },
                { key: "book", label: "ಪುಸ್ತಕ" }
            ];

            // 2.2 — Existing demo posts moved into the static layer.
            const BARAHA_STATIC_POSTS = [
                {
                    id: "demo-1",
                    category: "baraha",
                    title: "ನಮ್ಮ ಶಾಲೆಯ ದಿನಗಳು",
                    content: "ಕ್ಲಾಸ್‌ರೂಮ್, ಗಂಟೆ, ಆಟದ ಮೈದಾನ… ಮರೆಯಲಾಗದ ದಿನಗಳ ಕೆಲವು ಪುಟಗಳು.",
                    author: "ಶಿವ",
                    time: "2 ದಿನಗಳ ಹಿಂದೆ",
                    visibility: "members",
                    presentation: "default"
                },
                {
                    id: "demo-2",
                    category: "poem",
                    title: "ಮತ್ತೊಮ್ಮೆ ಮೊಳೆಯಲ್ಲಿ",
                    content: "ಹಳೆಯ ದಾರಿಯಲಿ\nಹೊಸ ಹೆಜ್ಜೆಗಳ ಸದ್ದು…",
                    author: "ರೇಖಾ",
                    time: "4 ದಿನಗಳ ಹಿಂದೆ",
                    visibility: "public",
                    presentation: "poem"
                },
                {
                    id: "demo-3",
                    category: "memory",
                    title: "ನಮ್ಮ ಮೊದಲ ಸ್ನೇಹಕೂಟ",
                    content: "ಮೊದಲ ಬಾರಿ ಎಲ್ಲರೂ ಮತ್ತೆ ಒಂದೇ ಜಾಗದಲ್ಲಿ ಕೂತ ದಿನ.",
                    author: "ನೀವು",
                    time: "1 ವಾರದ ಹಿಂದೆ",
                    visibility: "private",
                    presentation: "memory"
                },
                {
                    id: "demo-4",
                    category: "book",
                    title: "Why old friendships still matter",
                    content: "ಒಂದು ದೊಡ್ಡ ಬರಹದ ಮೊದಲ ಅಧ್ಯಾಯ.",
                    author: "ವಿನಯ್",
                    time: "2 ವಾರಗಳ ಹಿಂದೆ",
                    visibility: "members",
                    presentation: "book"
                },
                {
                    id: "demo-5",
                    category: "article",
                    title: "ಬಂಧಗಳ ಅರ್ಥ",
                    content: "ಸ್ನೇಹ ಎಂದರೆ ಕೇವಲ ನೆನಪುಗಳಲ್ಲ. ಅದು ನಮ್ಮನ್ನು ರೂಪಿಸಿದ ಸಂಬಂಧಗಳ ಕಥೆ.",
                    author: "ಅನಿಲ್",
                    time: "3 ವಾರಗಳ ಹಿಂದೆ",
                    visibility: "public",
                    presentation: "default"
                }
            ];

            let BARAHA_POSTS = BARAHA_STATIC_POSTS.slice();
            let barahaFeedInitialization = 0;

            let BARAHA_MEMBERSHIPS = [];

            const BARAHA_MODES = [
                { key: "ಬರಹ", label: "ಬರಹ" },
                { key: "ಕವನ", label: "ಕವನ" },
                { key: "ನೆನಪು", label: "ನೆನಪು" },
                { key: "ಲೇಖನ", label: "ಲೇಖನ" },
                { key: "ಟಿಪ್ಪಣಿ", label: "ಟಿಪ್ಪಣಿ" }
            ];

            const BARAHA_VISIBILITY = [
                { key: "private", label: "ಖಾಸಗಿ" },
                { key: "members", label: "ಸದಸ್ಯರು" },
                { key: "public", label: "ಸಾರ್ವಜನಿಕ" }
            ];

            const fab = document.getElementById("fab");
            const backdrop = document.getElementById("backdrop");
            const close = document.getElementById("close");
            const landing = document.getElementById("landing");
            const editor = document.getElementById("editor");
            const back = document.getElementById("back");
            const chips = document.getElementById("chips");
            const feed = document.getElementById("feed");
            const membershipSelect = document.getElementById("membershipSelect");
            const modes = document.getElementById("modes");
            const options = document.getElementById("options");
            const vis = document.getElementById("vis");
            const members = document.getElementById("members");
            const title = document.getElementById("title");
            const body = document.getElementById("body");
            const publish = document.getElementById("publish");

            function collectEditorData() {
                const activeMode = modes.querySelector(".mode.active");
                const activeVisibility = vis.querySelector(".v.active");
                const selectedMembershipIds = activeVisibility?.dataset.v === "members"
                    ? Array.from(members.querySelectorAll('input[type="checkbox"]:checked'), (input) => input.value)
                    : [];

                return {
                    id: null,
                    title: title.value,
                    content: body.value,
                    category: activeMode?.dataset.mode || null,
                    visibility: activeVisibility?.dataset.v || "private",
                    membershipIds: selectedMembershipIds,
                    authorMembershipId: membershipSelect.value || null
                };
            }

            function renderCategoryChips() {
                chips.innerHTML = [
                    '<button class="chip active" data-filter="all">ಎಲ್ಲಾ</button>',
                    ...BARAHA_CATEGORIES.map((category) => `<button class="chip" data-filter="${category.key}">${category.label}</button>`)
                ].join("");
            }

            function renderMembershipOptions() {
                membershipSelect.innerHTML = BARAHA_MEMBERSHIPS
                    .map((membership) => `<option value="${membership.key}">${membership.label}</option>`)
                    .join("");

                members.innerHTML = BARAHA_MEMBERSHIPS
                    .map((membership) => `<label><input type="checkbox" value="${membership.key}" checked /> ${membership.label}</label>`)
                    .join("");
            }

            function renderEditorModes() {
                modes.innerHTML = BARAHA_MODES
                    .map((mode, index) => `<button class="mode${index === 0 ? " active" : ""}" data-mode="${mode.key}">${mode.label}</button>`)
                    .join("");
            }

            function renderVisibilityOptions() {
                vis.innerHTML = BARAHA_VISIBILITY
                    .map((visibility, index) => `<button class="v${index === 0 ? " active" : ""}" data-v="${visibility.key}">${visibility.label}</button>`)
                    .join("");
            }

            function renderPosts() {
                feed.innerHTML = BARAHA_POSTS.map((post) => {
                    const category = BARAHA_CATEGORIES.find((item) => item.key === post.category);
                    const visibility = BARAHA_VISIBILITY.find((item) => item.key === post.visibility);
                    const cardClass = post.presentation === "default" ? "card" : `card ${post.presentation}`;
                    const type = `${category ? category.label : post.category} · ${visibility ? visibility.label : post.visibility}`;
                    if (post.presentation === "memory") {
                        return `<article class="${cardClass}" data-category="${post.category}" data-post-id="${post.id}" tabindex="0">
                            <div class="memory-art">✦</div>
                            <div>
                                <div class="type">${type}</div>
                                <h2>${post.title}</h2>
                                <div class="meta"><span>${post.author} · ${post.time}</span><span class="card-open-cue" aria-hidden="true">→</span></div>
                            </div>
                        </article>`;
                    }

                    return `<article class="${cardClass}" data-category="${post.category}" data-post-id="${post.id}" tabindex="0">
                        <div class="type">${type}</div>
                        <h2>${post.title}</h2>
                        <div class="meta"><span>${post.author} · ${post.time}</span><span class="card-open-cue" aria-hidden="true">→</span></div>
                    </article>`;
                }).join("");
            }

            function syncMembershipOptions(memberships) {
                BARAHA_MEMBERSHIPS = (Array.isArray(memberships) ? memberships : [])
                    .filter((membership) => membership.status === "active")
                    .map((membership) => ({
                        key: String(membership.id),
                        label: `${membership.school?.name || "School"} · ${membership.batch?.year || "Batch"}`,
                        id: membership.id,
                        schoolId: membership.schoolId,
                        batchId: membership.batchId,
                        membershipType: membership.membershipType,
                        status: membership.status
                    }));

                renderMembershipOptions();
            }

            async function initializeBaraha() {
                const initializationId = ++barahaFeedInitialization;

                BARAHA_POSTS = BARAHA_STATIC_POSTS.slice();
                renderPosts();

                const result = await barahaController.init();
                if (initializationId !== barahaFeedInitialization) return;

                syncMembershipOptions(result?.memberships || barahaContext.memberships);
                const livePosts = BarahaView.postsToUi(result?.posts?.posts || barahaModel.posts || []);
                BARAHA_POSTS = BARAHA_STATIC_POSTS.concat(livePosts);
                renderPosts();
            }

            function openSheet() {
                backdrop.classList.add("open");
            }

            function closeSheet() {
                backdrop.classList.remove("open");
            }

            // Write navigation is page-local UI state. The chooser stays transient;
            // only a valid editor mode is reflected in the URL and restored.
            function getWriteModeFromUrl() {
                const mode = new URL(window.location.href).searchParams.get("write");
                return BARAHA_MODES.some((item) => item.key === mode) ? mode : null;
            }

            function updateWriteUrl(mode, { replace = false } = {}) {
                const url = new URL(window.location.href);
                url.searchParams.set("write", mode);
                url.searchParams.delete("post");

                if (replace) {
                    window.history.replaceState(window.history.state, "", url.toString());
                    return;
                }

                window.history.pushState({ barahaWriteMode: mode }, "", url.toString());
            }

            function clearWriteUrl() {
                const url = new URL(window.location.href);
                if (!url.searchParams.has("write")) return;

                url.searchParams.delete("write");
                window.history.replaceState(window.history.state, "", url.toString());
            }

            // Single editor entry gate for chooser, refresh and direct URLs.
            function openEditor(mode) {
                closeSheet();
                landing.style.display = "none";
                editor.classList.add("open");
                modes.querySelectorAll(".mode").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
                title.focus();
            }

            // Single editor exit gate. UI restoration and write-route cleanup stay together.
            function closeEditor({ clearUrl = true } = {}) {
                editor.classList.remove("open");
                landing.style.display = "block";
                if (clearUrl) clearWriteUrl();
            }

            function restoreWriteEditorFromUrl() {
                const mode = getWriteModeFromUrl();
                if (!mode) return false;

                openEditor(mode);
                return true;
            }

            function syncWriteEditorWithUrl() {
                if (new URL(window.location.href).searchParams.has("post")) {
                    closeEditor({ clearUrl: false });
                    return;
                }

                if (restoreWriteEditorFromUrl()) return;
                closeEditor({ clearUrl: false });
            }

            renderCategoryChips();
            renderMembershipOptions();
            renderEditorModes();
            renderVisibilityOptions();
            initializeBaraha().catch((error) => {
                console.error("Baraha initialization failed:", error);
            }).finally(() => {
                if (new URL(window.location.href).searchParams.has("post")) {
                    openPostFromUrl();
                } else {
                    restoreWriteEditorFromUrl();
                }
            });

            window.addEventListener("pageshow", (event) => {
                if (!event.persisted) return;
                initializeBaraha().catch((error) => {
                    console.error("Baraha restore failed:", error);
                });
            });

            fab.addEventListener("click", openSheet);
            close.addEventListener("click", closeSheet);
            backdrop.addEventListener("click", (e) => {
                if (e.target === backdrop) closeSheet();
            });

            options.addEventListener("click", (e) => {
                const b = e.target.closest("button");
                if (!b) return;

                const mode = b.dataset.mode;
                if (!BARAHA_MODES.some((item) => item.key === mode)) return;

                updateWriteUrl(mode);
                openEditor(mode);
            });

            modes.addEventListener("click", (e) => {
                const b = e.target.closest("button");
                if (!b) return;
                modes.querySelectorAll(".mode").forEach((x) => x.classList.remove("active"));
                b.classList.add("active");
            });

            vis.addEventListener("click", (e) => {
                const b = e.target.closest("button");
                if (!b) return;
                vis.querySelectorAll(".v").forEach((x) => x.classList.remove("active"));
                b.classList.add("active");
                members.classList.toggle("open", b.dataset.v === "members");
            });

            chips.addEventListener("click", (e) => {
                const chip = e.target.closest(".chip");
                if (!chip) return;
                chips.querySelectorAll(".chip").forEach((x) => x.classList.remove("active"));
                chip.classList.add("active");
                const filter = chip.dataset.filter;
                document.querySelectorAll(".feed .card").forEach((card) => {
                    card.style.display = filter === "all" || card.dataset.category === filter ? "" : "none";
                });
            });

            async function openPostFromFeed(postId) {
                const livePost = barahaModel.posts.find((post) => String(post.id) === String(postId));
                const post = livePost || BARAHA_POSTS.find((item) => String(item.id) === String(postId));

                if (!post) return;

                try {
                    const currentPost = await barahaController.openPost(post);
                    readerOpenedFromUrl = false;
                    barahaReader.open(currentPost);
                } catch (error) {
                    console.error("Baraha post open failed:", error);
                }
            }

            async function openPostFromUrl() {
                const postId = new URLSearchParams(window.location.search).get("post");
                if (!postId) return;

                const demoPost = BARAHA_POSTS.find((post) => String(post.id) === String(postId));

                try {
                    const currentPost = demoPost
                        ? await barahaController.openPost(demoPost)
                        : await barahaController.openPost(postId);

                    if (currentPost) {
                        readerOpenedFromUrl = true;
                        barahaReader.open(currentPost);
                    }
                } catch (error) {
                    console.error("Baraha direct post open failed:", error);
                }
            }

            feed.addEventListener("click", (e) => {
                const card = e.target.closest(".card[data-post-id]");
                if (card) openPostFromFeed(card.dataset.postId);
            });

            feed.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                const card = e.target.closest(".card[data-post-id]");
                if (!card) return;
                e.preventDefault();
                openPostFromFeed(card.dataset.postId);
            });

            function check() {
                publish.disabled = !(title.value.trim() && body.value.trim());
                publish.style.opacity = publish.disabled ? ".45" : "1";
                publish.style.cursor = publish.disabled ? "not-allowed" : "pointer";
            }

            title.addEventListener("input", check);
            body.addEventListener("input", check);
            back.addEventListener("click", () => {
                closeEditor();
            });

            // Browser Back/Forward restores the same write state without creating
            // another editor path or disturbing the existing post reader route.
            window.addEventListener("popstate", () => {
                syncWriteEditorWithUrl();
            });
        </script>
       <div id="sk-account-root"></div>
<link rel="stylesheet" href="account.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="account.js?v=3" defer></script>
        <div data-sk-footer></div>
    </body>
</html>
